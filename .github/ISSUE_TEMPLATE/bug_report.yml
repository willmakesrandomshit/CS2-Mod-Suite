name: Bug report
description: Report a reproducible problem in one mod
title: "[Bug] "
body:
  - type: input
    id: mod
    attributes: { label: Mod, placeholder: "Road Rules" }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: "Mod version and CS2 version" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected result }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual result }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Screenshot, video or redacted logs, description: "Inspect files for private data before posting." }
  - type: textarea
    id: other_mods
    attributes: { label: Other relevant mods }
