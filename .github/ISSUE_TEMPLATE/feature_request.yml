name: Feature request
description: Propose a focused improvement
title: "[Feature] "
body:
  - type: input
    id: mod
    attributes: { label: Mod }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: behavior
    attributes: { label: Proposed behaviour }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Why this belongs in the mod's scope }
    validations: { required: true }
